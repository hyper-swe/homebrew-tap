name: Check mgit formula

# Audits and really installs Formula/mgit.rb on an Apple silicon runner, on
# every pull request that changes it and on every push to main (which includes
# the automated release update). The formula depends on libkrunfw from this
# tap on Apple silicon, and until now nothing exercised that combination: the
# libkrunfw workflow bottles only libkrunfw.
#
# It publishes nothing and installs only on the runner.
on:
  pull_request:
    paths:
      - Formula/mgit.rb
      - Formula/libkrunfw.rb
      - .github/workflows/mgit-formula.yml
      - .github/workflows/update-formula.yml
      - .github/scripts/rewrite_formula_urls.py
  push:
    branches: [main]
    paths:
      - Formula/mgit.rb
      - Formula/libkrunfw.rb
      - .github/workflows/mgit-formula.yml
      - .github/workflows/update-formula.yml
      - .github/scripts/rewrite_formula_urls.py
  # The release automation pushes the formula update with the repository
  # token, and a push made with that token starts no workflow run, so the
  # push trigger above never sees it. This runs after that workflow finishes.
  workflow_run:
    workflows: ["Update Formula"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mgit:
    name: Audit and install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    # A release update that failed has nothing new to check.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Serve this checkout as hyper-swe/tap, so the formulas are installed
      # exactly as they are in this change, with the one documented setup step.
      - name: Use this checkout as the hyper-swe/tap tap
        run: |
          taps="$(brew --repository)/Library/Taps/hyper-swe"
          mkdir -p "$taps"
          rm -f "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew trust hyper-swe/tap

      - name: Style
        run: brew style hyper-swe/tap/mgit

      - name: Audit
        run: brew audit --strict --formula hyper-swe/tap/mgit

      # The release update rewrites the urls and shas by text. Run its url
      # rewrite on a copy with a fake version: exactly the four url lines may
      # change, to that version, and the formula must carry no version line.
      - name: The release update's url rewrite changes only the four url lines
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*version "' Formula/mgit.rb; then
            echo "::error::Formula/mgit.rb has a version line; Homebrew reads the version from the urls"; exit 1
          fi
          copy="$(mktemp)"
          cp Formula/mgit.rb "$copy"
          python3 .github/scripts/rewrite_formula_urls.py "$copy" 9.9.9
          changed="$(diff Formula/mgit.rb "$copy" | grep -c '^>' || true)"
          [ "$changed" -eq 4 ] || { echo "::error::expected 4 changed lines, got $changed"; diff Formula/mgit.rb "$copy"; exit 1; }
          diff Formula/mgit.rb "$copy" | grep '^>' | grep -vq 'url "https://github.com/hyper-swe/mgit/releases/download/v9.9.9/mgit_9.9.9_' && { echo "::error::a changed line is not a rewritten url"; exit 1; } || true
          echo "ok: four url lines rewritten to 9.9.9, nothing else changed"

      # A drifted url format must stop the release update before it pushes:
      # the rewrite exits 1 and writes nothing, and update-formula.yml asks for
      # exactly four literal urls for mgit and runs before its push step.
      - name: A drifted url format is refused before the push
        run: |
          set -euo pipefail
          drift="$(mktemp)"
          sed 's#https://github.com/hyper-swe/mgit/releases/download/v[0-9.]*/#https://downloads.example.invalid/mgit/#' Formula/mgit.rb > "$drift"
          before="$(shasum -a 256 "$drift" | cut -d' ' -f1)"
          rc=0
          python3 .github/scripts/rewrite_formula_urls.py --expect 4 "$drift" 9.9.9 || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::a drifted url format exited $rc, expected 1"; exit 1; }
          [ "$(shasum -a 256 "$drift" | cut -d' ' -f1)" = "$before" ] || { echo "::error::the refusal still wrote the file"; exit 1; }
          grep -q -- '--expect 4 "$FORMULA" "$VERSION"' .github/workflows/update-formula.yml || { echo "::error::update-formula.yml does not ask for exactly four urls"; exit 1; }
          upd="$(grep -n 'rewrite_formula_urls.py --expect 4' .github/workflows/update-formula.yml | head -1 | cut -d: -f1)"
          push="$(grep -n 'name: Commit and push' .github/workflows/update-formula.yml | head -1 | cut -d: -f1)"
          [ -n "$upd" ] && [ -n "$push" ] && [ "$upd" -lt "$push" ] || { echo "::error::the url check does not come before the push step"; exit 1; }
          echo "ok: a drifted format exits 1 with the file untouched, and the check precedes the push"

      # A real install, not a dry run: it resolves the libkrunfw dependency
      # from this tap, builds it, and links both.
      - name: Install
        run: brew install --verbose hyper-swe/tap/mgit

      - name: Test
        run: brew test --verbose hyper-swe/tap/mgit

      - name: The install carries mgit and its libkrunfw dependency
        run: |
          prefix="$(brew --prefix)"
          test -x "$prefix/bin/mgit" || { echo "::error::mgit is not linked into $prefix/bin"; exit 1; }
          "$prefix/bin/mgit" --version
          test -e "$prefix/lib/libkrunfw.5.dylib" || { echo "::error::libkrunfw.5.dylib is not linked into $prefix/lib"; exit 1; }
          brew list --versions hyper-swe/tap/libkrunfw
